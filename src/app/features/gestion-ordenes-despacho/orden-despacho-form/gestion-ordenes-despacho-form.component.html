<div class="form-container">
  <h2>{{ editMode ? 'Editar' : 'Nueva' }} Orden de Despacho</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>

    <div class="form-group">
      <label>Fecha de despacho</label>
      <input type="date" formControlName="fechaDespacho">
    </div>

    <div class="form-group">
      <label>Estado</label>
      <select formControlName="estado">
        <option [ngValue]="EstadoDeOrden.PENDIENTE">PENDIENTE</option>
        <option [ngValue]="EstadoDeOrden.COMPLETADA">COMPLETADA</option>
      </select>
    </div>

    <app-typeahead-select
      formControlName="cliente"
      label="Cliente"
      placeholder="Buscá por nombre o ID"
      [options]="clientes"
      optionLabelKey="nombre"
      optionValueKey="idCliente"
      [loading]="clientesLoading"
      [helperText]="clientes.length ? 'Escribí para filtrar' : ''"
      [errorText]="clienteErrorMessage"
    ></app-typeahead-select>

    <div class="detalles">
      <h3>Detalles de despacho</h3>

      @for (item of detallesArray; track $index) {
        <div [formGroup]="item.control" class="detalle">

          <app-typeahead-select
            formControlName="producto"
            label="Producto"
            placeholder="Buscar por nombre o SKU"
            [options]="productos"
            optionLabelKey="nombre"
            optionValueKey="idProducto"
            [displayWith]="productoDisplayFn"
            [loading]="productosLoading"
            [helperText]="productos.length ? 'Escribí para filtrar' : ''"
            [errorText]="productoErrorMessage(item.index)"
            (optionSelected)="onProductoSelected(item.index, $event)"
            noResultsText="No se encontraron productos"
          ></app-typeahead-select>

          <div class="stock">Stock disponible: {{ item.control.value.stockDisponible }}</div>

          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" formControlName="cantidad" min="1">
          </div>

          <button type="button" (click)="eliminarDetalle($index)">Eliminar</button>
        </div>
      }

      <button type="button" (click)="agregarDetalle()">Agregar Detalle</button>
    </div>

    <div class="button-group">
      <button type="submit">Guardar</button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
