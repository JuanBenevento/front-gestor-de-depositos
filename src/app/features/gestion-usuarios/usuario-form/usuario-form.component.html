<div class="form-container">
  <h2>{{ editMode ? 'Editar' : 'Nuevo' }} Usuario</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>

    <div class="form-group">
      <label>Nombre de usuario</label>
      <input type="text" formControlName="nombre">
      <div *ngIf="form.controls['nombre'].invalid && form.controls['nombre'].touched" class="error">
        Requerido
      </div>
    </div>

    <div class="form-group" *ngIf="!editMode">
      <label>Contraseña</label>
      <input type="password" formControlName="contrasenia">
      <div *ngIf="form.controls['contrasenia'].invalid && form.controls['contrasenia'].touched" class="error">
        Requerido
      </div>
    </div>

    <div class="form-group">
      <label>Apellido</label>
      <input type="text" formControlName="apellido">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email">
      <div *ngIf="form.controls['email'].invalid && form.controls['email'].touched" class="error">
        Formato de correo inválido
      </div>
    </div>

    <div class="form-group">
      <label>Rol</label>
      <select formControlName="idRol">
        <option [ngValue]="1">ADMIN</option>
        <option [ngValue]="2">OPERARIO</option>
      </select>
    </div>

    <div class="button-group">
      <button type="submit" [disabled]="form.invalid">Guardar</button>
      <button type="button" class="cancel-btn" routerLink="../">Cancelar</button>
    </div>

  </form>
</div>
