<div class="user-management-container">
  <h2>Gestion de Zonas</h2>

  <button class="btn new-btn" [routerLink]="['/dashboard/zonas/nuevo']">
    + Nueva Zona
  </button>

  <div class="search-row">
    <div class="search-group">
      <input
        type="number"
        placeholder="ID de la zona"
        [(ngModel)]="idBuscar"
        (keyup.enter)="buscarPorId()"
      />
      <button (click)="buscarPorId()">Buscar ID</button>
    </div>

    @if (filtrado) {
      <div class="search-group">
        <button class="btn secondary-btn" (click)="refresh()">Limpiar</button>
      </div>
    }
  </div>

  @if (loading) {
    <div class="loading">Cargando...</div>
  }

  @if (error) {
    <div class="error">{{ error }}</div>
  }

  @if (zonas.length) {
    <div class="table-wrapper">
      <table class="user-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (z of zonas; track z.idZona) {
          <tr>
            <td>{{ z.idZona }}</td>
            <td>{{ z.nombre }}</td>
            <td>{{ z.descripcion }}</td>
            <td class="actions">
              <button [routerLink]="['/dashboard/zonas/editar', z.idZona]" class="btn edit-btn">Editar</button>
              <button (click)="eliminar(z.idZona!)" class="btn delete-btn">Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
      </table>
    </div>
  }

  @if (!zonas.length && !loading) {
    <p>Sin zonas para mostrar.</p>
  }

  <button (click)="volver()" class="btn secondary-btn small-btn">← Volver</button>
</div>
