<div class="dashboard-container">

  <nav class="sidebar">
    <div class="brand">Gestor de Depositos</div>

    <ul class="nav-links">
      <li><button class="nav-btn" (click)="navigate('/dashboard')">Inicio</button></li>

      @if (isAdmin()) {
        <li><button class="nav-btn" (click)="navigate('/dashboard/usuarios')">Usuarios</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/zonas')">Zonas</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/ubicaciones')">Ubicaciones</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/proveedores')">Proveedores</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/clientes')">Clientes</button></li>
      }

      @if (isOperativo() || isAdmin()) {
        <li class="dropdown">
          <button class="nav-btn" (click)="toggleDropdown($event)">Ordenes ▾</button>
          <ul class="dropdown-menu" [class.open]="dropdownsOpen['Ordenes ▾']">
            <li><button class="nav-btn dropdown-item" (click)="navigate('/dashboard/ordenesRecepcion')">Recepción</button></li>
            <li><button class="nav-btn dropdown-item" (click)="navigate('/dashboard/ordenesDespacho')">Despacho</button></li>
          </ul>
        </li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/productos')">Productos</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/inventarios')">Inventarios</button></li>
        <li><button class="nav-btn" (click)="navigate('/dashboard/movimientosInventario')">Movimiento Inventario</button></li>
      }

      <li class="logout-li">
        <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
      </li>
    </ul>
  </nav>

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
